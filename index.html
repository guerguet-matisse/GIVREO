<!doctype html>

<html lang="fr" data-theme="nuit">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1620">
<meta name="description" content="Guidage GPS du circuit de salage – Itinéraire n°3 (Soissons)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<title>GPS Salage – Itinéraire 3</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="plaque" aria-live="polite">
    <span id="badge">1</span>
    <div>
      <div id="rue">Appuie sur « Démarrer »</div>
      <div id="sous"><span id="partTitre"></span> · <span id="prog"></span></div>
    </div>
    <div id="nav">
      <svg id="fleche" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 20 21 12 17 4 21z"/></svg>
      <div id="dist">–</div>
    </div>
  </header>
  <div id="stats">
    <span id="sKm"></span><span id="sFin"></span><span id="sEtat">GPS arrêté</span><span id="sMeteo"></span>
  </div>
  <div id="barre" role="progressbar" aria-label="Avancement de la tournée" aria-valuemin="0" aria-valuemax="100"><i id="barreI"></i></div>

  <main id="map" aria-label="Carte"></main>
  <div id="alerte" role="alert"></div>
  <div id="toast" role="status"></div>
  <div id="flottants">
    <button id="bSuivi" class="rond on" aria-label="Centrer sur ma position" aria-pressed="true">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg></button>
    <button id="bNuit" class="rond" aria-label="Basculer jour / nuit">
      <svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4 6.5 6.5 0 0 0 20 14.5z"/></svg></button>
  </div>

  <section id="feuille" hidden>
    <div class="feuille-tete"><h2 id="feuilleTitre"></h2><button id="fermer" aria-label="Fermer">✕</button></div>
    <div class="feuille-corps">

      <div id="p-tournee" class="panneau" hidden>
        <div id="meteoCarte" class="carte">Météo…</div>
        <label class="champ">Tournée<select id="selTournee"></select></label>
        <div class="seg" id="segParts"></div>
        <div id="liste" class="liste"></div>
        <h3>Outils</h3>
        <div class="outils">
          <button id="bCaler">Caler le circuit</button>
          <button id="bRoute">Aligner sur les rues</button>
          <button id="bRec">Enregistrer ma trace</button>
          <button id="bEffTrace">Effacer ma trace</button>
          <button id="bEdit">Éditer les points</button>
          <button id="bImport">Importer GPX / JSON</button>
          <button id="bGpx">Exporter GPX</button>
          <button id="bJson">Exporter JSON</button>
        </div>
        <input type="file" id="fichier" accept=".gpx,.json,application/gpx+xml,application/json" hidden>
      </div>

      <div id="p-journal" class="panneau" hidden>
        <div id="jCourant" class="carte"></div>
        <label class="champ">Sel utilisé (kg)<input id="jSel" type="number" inputmode="decimal" min="0" step="10"></label>
        <label class="champ">Notes<textarea id="jNotes" rows="3" placeholder="Incident, état de la route, remarque…"></textarea></label>
        <div class="outils">
          <button id="jFin">Terminer la tournée</button>
          <button id="jCsv">Exporter CSV</button>
          <button id="jPdf">Imprimer / PDF</button>
        </div>
        <h3>Historique</h3>
        <div id="jListe" class="liste"></div>
      </div>

      <div id="p-reglages" class="panneau" hidden>
        <div class="champ"><span>Thème</span>
          <div class="seg" id="segTheme"><button data-v="auto">Auto</button><button data-v="nuit">Nuit</button><button data-v="jour">Jour</button></div></div>
        <div class="champ"><span>Taille du texte</span>
          <div class="seg" id="segTaille"><button data-v="1">Normal</button><button data-v="1.15">Grand</button><button data-v="1.3">Très grand</button></div></div>
        <label class="ligne"><span>Guidage vocal</span><input type="checkbox" id="rVoix"></label>
        <label class="champ"><span>Distance de validation d'un point : <b id="rRayonV"></b></span><input type="range" id="rRayon" min="20" max="80" step="5"></label>
        <label class="champ">Vitesse moyenne pour l'heure de fin (km/h)<input type="number" id="rVitesse" min="5" max="60" inputmode="numeric"></label>
        <button id="rReset" class="danger">Tout réinitialiser</button>
        <p class="mentions">© 2026 Matisse Guerguet – Tous droits réservés.<br>Cartes © contributeurs d'OpenStreetMap · itinéraires OSRM · météo Open-Meteo. Le risque de verglas est indicatif et ne remplace pas la vigilance Météo-France.</p>
      </div>
    </div>
  </section>

  <footer id="dock">
    <div id="commandes">
      <button id="bPrec" aria-label="Point précédent">◀</button>
      <button id="bStart">Démarrer</button>
      <button id="bSuiv" aria-label="Point suivant">▶</button>
    </div>
    <nav id="onglets">
      <button data-p="tournee">Tournée</button>
      <button data-p="journal">Journal</button>
      <button data-p="reglages">Réglages</button>
    </nav>
  </footer>
</div>
<div id="impression"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="data.js"></script>
<script src="lib.js"></script>
<script src="app.js"></script>
</body>
</html>
